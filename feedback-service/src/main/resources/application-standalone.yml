server:
  port: 8085
  forward-headers-strategy: framework
eureka:
  client:
    enabled: false
spring:
  boot:
    admin:
      client:
        url: http://localhost:8086
        instance:
          service-host-type: ip
          name: feedback-service
        enabled: true
  cloud:
    config:
      enabled: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/feedback
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/sc
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/sc
            user-name-attribute: preferred_username
        registration:
          metrics:
            provider: keycloak
            client-id: feedback-service
            client-secret: t8qRawo8wTBAE9IqKSnGez699B9STMwj
            authorization-grant-type: client_credentials
            scope:
              - metrics_server
springdoc:
  swagger-ui:
    oauth:
      client-id: feedback-service-swagger-ui
      use-pkce-with-authorization-code-grant: true
    path: /swagger-ui-feedback
    url: /feedback-api.yml
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'