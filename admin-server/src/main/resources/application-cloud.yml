server:
  port: 8086
  forward-headers-strategy: framework
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
    healthcheck:
      enabled: true
spring:
  application:
    name: sc-admin-server
  cloud:
    config:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/sc
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/sc
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: admin-service
            client-secret: Q2rxsXG0AzRbSdAzKkzLbecYmMDGDVKG
            authorization-grant-type: client_credentials
            scope:
              - openid
              - metrics
              - microprofile-jwt
          discovery:
            provider: keycloak
            client-id: admin-service
            client-secret: Q2rxsXG0AzRbSdAzKkzLbecYmMDGDVKG
            authorization-grant-type: client_credentials
            scope:
              - discovery
          login:
            provider: keycloak
            client-id: admin-service
            client-secret: Q2rxsXG0AzRbSdAzKkzLbecYmMDGDVKG
            scope:
              - openid
              - metrics
              - microprofile-jwt
