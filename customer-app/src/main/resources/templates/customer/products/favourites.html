<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Favourites list &ndash; aeresfiru</title>
</head>
<body>
<h1>Favourite products</h1>
<a data-th-href="@{/customer/products/list}">Product list</a>
<form>
    <label>
        Filter: <input type="text" name="filter" data-th-value="${filter != null ? filter : ''}">
        <button type="submit">Search</button>
    </label>
</form>
<ul>
    <li data-th-each="product : ${products}">
        <strong>
            <a data-th-text="${product.title}"
               data-th-href="@{/customer/products/{productId}(productId=${product.id})}"></a>
        </strong>
        <p data-th-text="${product.details}"></p>
    </li>
</ul>
</body>
</html>
