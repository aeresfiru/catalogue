<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Products</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container p-5">
    <section class="container mt-5 flex-grow-1">
        <h2 class="mb-4">Your Favorite Products</h2>
        <div class="row">
            <div th:if="${products == null || products.isEmpty()}">
                <p>You have no favorite products yet.</p>
            </div>
            <div th:each="product : ${products}" class="col-md-4 mb-4">
                <div class="card">
                    <a th:href="@{/customer/products/{productId}(productId=${product.id})}" class="product-link">
                        <img src="https://via.placeholder.com/300x200" class="card-img-top"
                             alt="Product Image">
                        <div class="card-body">
                            <h5 class="card-title">[[${product.title}]]</h5>
                            <p class="card-text">[[${product.details}]]</p>
                            <div class="text-warning">
<!--                                <i class="fas fa-star" th:each="star : ${#numbers.sequence(1, product.rating)}"></i>-->
<!--                                <i class="far fa-star" th:each="star : ${#numbers.sequence(product.rating + 1, 5)}"></i>-->
                            </div>
                            <form method="post"
                                  th:action="@{/customer/products/{productId}/remove-from-favourites(productId=${product.id})}"
                                  class="mt-2">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-heart-broken"></i> Remove from Favorites
                                </button>
                            </form>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Pagination -->
<!--        <div class="row">-->
<!--            <div class="col-12">-->
<!--                <nav>-->
<!--                    <ul class="pagination justify-content-center">-->
<!--                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">-->
<!--                            <a class="page-link" th:href="@{/customer/favorites(page=${currentPage - 1})}">Previous</a>-->
<!--                        </li>-->
<!--                        <li th:each="pageNum : ${#numbers.sequence(1, totalPages)}" class="page-item"-->
<!--                            th:classappend="${currentPage == pageNum} ? 'active'">-->
<!--                            <a class="page-link" th:href="@{/customer/favorites(page=${pageNum})}">[[${pageNum}]]</a>-->
<!--                        </li>-->
<!--                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">-->
<!--                            <a class="page-link" th:href="@{/customer/favorites(page=${currentPage + 1})}">Next</a>-->
<!--                        </li>-->
<!--                    </ul>-->
<!--                </nav>-->
<!--            </div>-->
<!--        </div>-->
    </section>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scroll_to_top_btn :: scrollToTopBtn}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/scrollToTop.js}"></script>
</body>
</html>
