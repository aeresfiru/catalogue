aeresfiru:
  services:
    catalogue:
      url: http://localhost:8081
    feedback:
      url: http://localhost:8085
server:
  port: 8083
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/sc
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/sc
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: customer-app
            client-secret: G1ze2jJUa6ZcAuGKWGfqA73DmRKyAAjA
            authorization-grant-type: authorization_code
            scope:
              - openid
              - view_catalogue
          metrics:
            provider: keycloak
            client-id: customer-app-metrics-client
            client-secret: sSBjtJnkYR2cVRpOdBLPlUuE34ZMCKpy
            authorization-grant-type: client_credentials
            scope:
              - metrics_server
  boot:
    admin:
      client:
        enabled: true
        instance:
          service-host-type: ip
          name: customer-app
        url: http://localhost:8086
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
logging:
  level:
    de:
      codecentric: DEBUG