spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalogue
    username: catalogue
    password: catalogue
  flyway:
    schemas:
      - public
      - catalogue
  jpa:
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/sc
  data:
    web:
      pageable:
        one-indexed-parameters: true
server:
  port: 8081
logging:
  level:
    sql: info
    org:
      springframework:
        security: DEBUG
springdoc:
  swagger-ui:
    oauth:
      client-id: catalogue-service-swagger-ui
      use-pkce-with-authorization-code-grant: true
    path: /catalogue-api
    url: /catalogue-api.yaml
keycloak:
  uri: http://localhost:8082
