eureka:
  instance:
    hostname: host.docker.internal
    leaseRenewalIntervalInSeconds: 1
    leaseExpirationDurationInSeconds: 1
  client:
    enabled: true
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka/
    registryFetchIntervalSeconds: 1
spring:
  boot:
    admin:
      client:
        enabled: false
  data:
    web:
      pageable:
        one-indexed-parameters: true
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/catalogue
    username: catalogue
    password: catalogue
  jpa:
    show-sql: true
  flyway:
    schemas:
      - public
      - catalogue
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://host.docker.internal:8082/realms/sc
      client:
        provider:
          keycloak:
            issuer-uri: http://host.docker.internal:8082/realms/sc
            user-name-attribute: preferred_username
        registration:
          discovery:
            provider: keycloak
            client-id: catalogue-service
            client-secret: uFDR2E2jjr7D33GMSBjlUwURH301hwjA
            authorization-grant-type: client_credentials
            scope:
              - discovery
          metrics:
            provider: keycloak
            client-id: catalogue-service
            client-secret: uFDR2E2jjr7D33GMSBjlUwURH301hwjA
            authorization-grant-type: client_credentials
            scope:
              - metrics_server
springdoc:
  swagger-ui:
    oauth:
      client-id: catalogue-service-swagger-ui
      use-pkce-with-authorization-code-grant: true
    path: /swagger-ui-catalogue
    url: /catalogue-api.yml
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'