eureka:
  instance:
    leaseRenewalIntervalInSeconds: 1
    leaseExpirationDurationInSeconds: 1
    hostname: localhost
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registryFetchIntervalSeconds: 1
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/sc
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/sc
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: admin-service
            client-secret: 8wDlmDewQ5k48xjAtns6RlcwKu1Nb3LS
            authorization-grant-type: client_credentials
            scope:
              - openid
              - metrics
              - microprofile-jwt
          discovery:
            provider: keycloak
            client-id: admin-service
            client-secret: 8wDlmDewQ5k48xjAtns6RlcwKu1Nb3LS
            authorization-grant-type: client_credentials
            scope:
              - discovery
          login:
            provider: keycloak
            client-id: admin-service
            client-secret: 8wDlmDewQ5k48xjAtns6RlcwKu1Nb3LS
            scope:
              - openid
              - metrics
              - microprofile-jwt
