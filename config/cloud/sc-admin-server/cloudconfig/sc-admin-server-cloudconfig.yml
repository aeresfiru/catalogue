eureka:
  instance:
    hostname: host.docker.internal
    leaseRenewalIntervalInSeconds: 1
    leaseExpirationDurationInSeconds: 1
  client:
    enabled: true
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka/
    registryFetchIntervalSeconds: 1
    register-with-eureka: false
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://host.docker.internal:8082/realms/sc
      client:
        provider:
          keycloak:
            issuer-uri: http://host.docker.internal:8082/realms/sc
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: admin-service
            client-secret: Q2rxsXG0AzRbSdAzKkzLbecYmMDGDVKG
            authorization-grant-type: client_credentials
            scope:
              - openid
              - metrics
              - microprofile-jwt
          discovery:
            provider: keycloak
            client-id: admin-service
            client-secret: Q2rxsXG0AzRbSdAzKkzLbecYmMDGDVKG
            authorization-grant-type: client_credentials
            scope:
              - discovery
          login:
            provider: keycloak
            client-id: admin-service
            client-secret: Q2rxsXG0AzRbSdAzKkzLbecYmMDGDVKG
            scope:
              - openid
              - metrics
              - microprofile-jwt
