eureka:
  instance:
    hostname: host.docker.internal
    leaseRenewalIntervalInSeconds: 1
    leaseExpirationDurationInSeconds: 1
  client:
    enabled: true
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka/
    registryFetchIntervalSeconds: 1
spring:
  boot:
    admin:
      client:
        enabled: false
  data:
    mongodb:
      uri: mongodb://host.docker.internal:27017/feedback
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://host.docker.internal:8082/realms/sc
      client:
        provider:
          keycloak:
            issuer-uri: http://host.docker.internal:8082/realms/sc
            user-name-attribute: preferred_username
        registration:
          discovery:
            provider: keycloak
            client-id: feedback-service
            client-secret: t8qRawo8wTBAE9IqKSnGez699B9STMwj
            authorization-grant-type: client_credentials
            scope:
              - discovery
          metrics:
            provider: keycloak
            client-id: feedback-service-metrics-client
            client-secret: t8qRawo8wTBAE9IqKSnGez699B9STMwj
            authorization-grant-type: client_credentials
            scope:
              - metrics_server
springdoc:
  swagger-ui:
    oauth:
      client-id: feedback-service-swagger-ui
      use-pkce-with-authorization-code-grant: true
    path: /swagger-ui-feedback
    url: /feedback-api.yml
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'