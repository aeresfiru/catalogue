aeresfiru:
  services:
    catalogue:
      uri: lb://sc-catalogue-service
    feedback:
      uri: lb://sc-feedback-service
eureka:
  instance:
    hostname: host.docker.internal
    leaseRenewalIntervalInSeconds: 1
    leaseExpirationDurationInSeconds: 1
  client:
    enabled: true
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka/
    registryFetchIntervalSeconds: 1
spring:
  boot:
    admin:
      client:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://host.docker.internal:8082/realms/sc
      client:
        provider:
          keycloak:
            issuer-uri: http://host.docker.internal:8082/realms/sc
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: customer-app
            client-secret: Wso5KNTzBfVdRPgtFMigQPV1Q17uSjNO
            authorization-grant-type: authorization_code
            scope:
              - openid
              - view_catalogue
          discovery:
            provider: keycloak
            client-id: customer-app
            client-secret: Wso5KNTzBfVdRPgtFMigQPV1Q17uSjNO
            authorization-grant-type: client_credentials
            scope:
              - discovery
          metrics:
            provider: keycloak
            client-id: customer-app
            client-secret: Wso5KNTzBfVdRPgtFMigQPV1Q17uSjNO
            authorization-grant-type: client_credentials
            scope:
              - metrics_server
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'