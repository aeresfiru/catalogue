<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>403 Forbidden</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            margin-top: 50px;
            text-align: center;
        }

        h1 {
            font-weight: bold;
            margin-bottom: 30px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .error-code {
            font-size: 80px;
            font-weight: bold;
            color: #dc3545;
        }

        .error-message {
            font-size: 24px;
            margin-top: 20px;
        }

        .btn-primary {
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="error-code">403</div>
    <h1>Oops! Access Forbidden</h1>
    <p class="error-message">You are not allowed to access this page.</p>
</div>
</body>
</html>
